    <script>
        (function() {
            var storedTheme = localStorage.getItem('liyh-theme');
            if (storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark-theme');
            }
        })();
    </script>

    <style>
        :root {
            --primary: #3A6D81;
            --primary-light: #4E8DA6;
            --accent: #4E8DA6;
            --accent-dark: #3A6D81;
            --text: #2D3748;
            --text-light: #526E7A;
            --border: #D1E8E8;
            --background: #FFFFFF;
            --card-bg: #FFFFFF;
            --card-border: #D6E4E8;
            --hero-bg: #EBF2F4;
            --code-inline-bg: #E8F6F4;
            --code-inline-color: #4E8DA6;
            --shadow: 0 16px 40px -12px rgba(58, 109, 129, 0.12);
            --bg-glow-1: rgba(58, 109, 129, 0.08);
            --bg-glow-2: rgba(78, 141, 166, 0.04);
        }

        html.dark-theme {
            --primary: #63B3CE;
            --primary-light: #7ED4EC;
            --accent: #56A7C2;
            --accent-dark: #63B3CE;
            --text: #E3ECEF;
            --text-light: #94AEC0;
            --border: #23353D;
            --background: #0F171A;
            --card-bg: #141E22;
            --card-border: #22363E;
            --hero-bg: #132227;
            --code-inline-bg: #1E333C;
            --code-inline-color: #63B3CE;
            --shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.5);
            --bg-glow-1: rgba(99, 179, 206, 0.07);
            --bg-glow-2: rgba(86, 167, 194, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            background-color: var(--background);
            background-image: 
                radial-gradient(circle at 50% 15%, var(--bg-glow-1) 0%, transparent 55%),
                radial-gradient(circle at 85% 85%, var(--bg-glow-2) 0%, transparent 45%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        /* Theme toggle button in top right */
        .theme-toggle-wrap {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 10;
        }

        .theme-toggle-btn {
            background: rgba(78, 141, 166, 0.08);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-light);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            padding: 0;
        }

        .theme-toggle-btn:hover {
            background: rgba(78, 141, 166, 0.18);
            color: var(--primary);
            transform: rotate(15deg) scale(1.06);
            border-color: var(--primary);
        }

        .moon-icon { display: block; }
        .sun-icon { display: none; }

        html.dark-theme .moon-icon { display: none; }
        html.dark-theme .sun-icon { display: block; color: #F59E0B; }

        /* Main Card */
        .coming-soon-card {
            max-width: 540px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 3.25rem 2.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            backdrop-filter: blur(10px);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        /* Logo and Brand header */
        .brand-header {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 1.5rem;
            user-select: none;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(58, 109, 129, 0.15));
        }

        .brand-title {
            font-family: 'Source Sans 3', 'Inter', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        /* Subtle category / status badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: var(--code-inline-bg);
            color: var(--code-inline-color);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.3rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 1.25rem;
            user-select: none;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(78, 141, 166, 0.2);
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        /* Main Heading */
        .headline {
            font-family: 'Source Sans 3', 'Inter', sans-serif;
            font-size: 2.75rem;
            font-weight: 700;
            line-height: 1.15;
            color: var(--primary);
            margin-bottom: 0.85rem;
            letter-spacing: -0.025em;
        }

        /* Description text */
        .description {
            font-size: 1.05rem;
            color: var(--text-light);
            line-height: 1.65;
            max-width: 440px;
            margin-bottom: 2rem;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.85rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
            line-height: 1;
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--primary);
            border: 1.5px solid var(--border);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(58, 109, 129, 0.12);
        }

        .btn-icon {
            flex-shrink: 0;
            display: inline-block;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .coming-soon-card {
                padding: 2.5rem 1.5rem;
            }
            .headline {
                font-size: 2.25rem;
            }
            .description {
                font-size: 0.98rem;
            }
        }
    </style>
</head>
